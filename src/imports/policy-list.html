<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>공약 - 정민재</title>
  <meta name="description" content="기초의원 후보 정민재의 핵심 공약을 확인하세요">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Navigation -->
  <nav class="nav scrolled" id="nav">
    <div class="nav-container">
      <a href="index.html" class="nav-logo">
        <img src="https://hebbkx1anhila5yf.public.blob.vercel-storage.com/%EC%A6%9D%EB%AA%85%EC%82%AC%EC%A7%84%20%EA%B3%B5-p4iNu7hIwTu6pf1FJ2hw4fq9CHegHr.jpg" alt="정민재 후보" class="nav-logo-photo">
        <div class="nav-logo-text">
          <span class="nav-logo-name">정민재</span>
          <span class="nav-logo-slogan">우리 동네 내일을 코딩합니다</span>
        </div>
      </a>
      
      <div class="nav-links">
        <a href="index.html" class="nav-link">홈</a>
        <a href="about.html" class="nav-link">후보 소개</a>
        <a href="policy-list.html" class="nav-link active">공약</a>
        <a href="contact.html" class="nav-link">함께하기</a>
      </div>
      
      <button class="nav-mobile-toggle" id="mobileToggle" aria-label="메뉴 열기">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="3" y1="12" x2="21" y2="12"></line>
          <line x1="3" y1="6" x2="21" y2="6"></line>
          <line x1="3" y1="18" x2="21" y2="18"></line>
        </svg>
      </button>
    </div>
    
    <div class="nav-mobile-menu" id="mobileMenu">
      <a href="index.html" class="nav-link">홈</a>
      <a href="about.html" class="nav-link">후보 소개</a>
      <a href="policy-list.html" class="nav-link active">공약</a>
      <a href="contact.html" class="nav-link">함께하기</a>
    </div>
  </nav>

  <!-- Survey Modal (appears on page load) -->
  <div class="modal-overlay active" id="surveyModal">
    <div class="modal-content">
      <div class="modal-header">
        <h2 class="modal-title">맞춤 공약 찾기</h2>
        <p class="modal-description">연령대와 거주지역을 선택하시면<br>맞춤형 공약을 안내해드립니다</p>
      </div>
      
      <form id="surveyForm" class="modal-form">
        <div class="form-group">
          <label class="form-label" for="age">연령대를 선택해주세요</label>
          <div class="form-options" id="ageOptions">
            <button type="button" class="form-option" data-value="20">20대</button>
            <button type="button" class="form-option" data-value="30">30대</button>
            <button type="button" class="form-option" data-value="40">40대</button>
            <button type="button" class="form-option" data-value="50">50대</button>
            <button type="button" class="form-option" data-value="60">60대 이상</button>
          </div>
          <input type="hidden" id="age" name="age" required>
        </div>
        
        <div class="form-group">
          <label class="form-label" for="region">거주 지역을 선택해주세요</label>
          <div class="form-options" id="regionOptions">
            <button type="button" class="form-option" data-value="A">A동네</button>
            <button type="button" class="form-option" data-value="B">B동네</button>
            <button type="button" class="form-option" data-value="C">C동네</button>
            <button type="button" class="form-option" data-value="D">D동네</button>
          </div>
          <input type="hidden" id="region" name="region" required>
        </div>
        
        <button type="submit" class="btn btn-primary form-submit" id="submitBtn" disabled>
          맞춤 공약 확인하기
          <svg class="btn-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="5" y1="12" x2="19" y2="12"></line>
            <polyline points="12 5 19 12 12 19"></polyline>
          </svg>
        </button>
      </form>
    </div>
  </div>

  <!-- Background (visible behind modal) -->
  <section class="policy-hero">
    <div class="policy-hero-content">
      <h1 class="policy-hero-title">
        실현 가능한 <span class="text-highlight">약속</span>
      </h1>
      <p class="policy-hero-description">
        정민재 후보의 5대 핵심 공약
      </p>
    </div>
  </section>

  <script src="navigation.js"></script>
  <script>
    // Survey Modal Logic
    document.addEventListener('DOMContentLoaded', function() {
      const modal = document.getElementById('surveyModal');
      const form = document.getElementById('surveyForm');
      const submitBtn = document.getElementById('submitBtn');
      const ageInput = document.getElementById('age');
      const regionInput = document.getElementById('region');
      
      let selectedAge = null;
      let selectedRegion = null;
      
      // Age option buttons
      document.querySelectorAll('#ageOptions .form-option').forEach(btn => {
        btn.addEventListener('click', function() {
          document.querySelectorAll('#ageOptions .form-option').forEach(b => b.classList.remove('selected'));
          this.classList.add('selected');
          selectedAge = this.dataset.value;
          ageInput.value = selectedAge;
          checkFormComplete();
        });
      });
      
      // Region option buttons
      document.querySelectorAll('#regionOptions .form-option').forEach(btn => {
        btn.addEventListener('click', function() {
          document.querySelectorAll('#regionOptions .form-option').forEach(b => b.classList.remove('selected'));
          this.classList.add('selected');
          selectedRegion = this.dataset.value;
          regionInput.value = selectedRegion;
          checkFormComplete();
        });
      });
      
      function checkFormComplete() {
        if (selectedAge && selectedRegion) {
          submitBtn.disabled = false;
        }
      }
      
      // Form submission
      form.addEventListener('submit', function(e) {
        e.preventDefault();
        
        // Mapping logic based on age and region combination
        // policy1: 20대 + A동네 (청년 일자리 + A동네 발전)
        // policy2: 40대 + A동네 (교육 환경 + A동네 생활 인프라)
        // policy3: 30대/50대 또는 C/D동네 (스마트 행정 + 청년 일자리)
        // policy4: 60대 이상 + B동네 (어르신 복지 + B동네 생활 환경)
        // policy5: 기타 (스마트시티 + 지역 발전 비전)
        
        let targetPolicy = 3; // default
        
        if (selectedAge === '20' && selectedRegion === 'A') {
          targetPolicy = 1;
        } else if (selectedAge === '40' && selectedRegion === 'A') {
          targetPolicy = 2;
        } else if (selectedAge === '60' && selectedRegion === 'B') {
          targetPolicy = 4;
        } else if ((selectedAge === '30' || selectedAge === '50') || (selectedRegion === 'C' || selectedRegion === 'D')) {
          targetPolicy = 3;
        } else {
          targetPolicy = 5;
        }
        
        // Save entry point to localStorage
        localStorage.setItem('campaignEntryPage', targetPolicy);
        localStorage.setItem('campaignUserAge', selectedAge);
        localStorage.setItem('campaignUserRegion', selectedRegion);
        
        // Redirect to appropriate policy page
        window.location.href = 'policy' + targetPolicy + '.html';
      });
    });
  </script>
</body>
</html>
